const V3 = THREE.Vector3, Quat = THREE.Quaternion, M4 = THREE.Matrix4;

function key(T, x) {            // cubic Hermite through a small table of [x, value]

/* Damped springs. Every animated channel goes through one: x chases t with stiffness w (rad/s) and damping ratio z. */
function springBank() {

  class VS {
    constructor(x,y,z,w,zeta=1) { this.s = [sp(x,w,zeta), sp(y,w,zeta), sp(z,w,zeta)]; }

/* ═══════════════════════════════ §1  PROPORTIONS ═══════════════════════════════

/* ═══════════════════════════════ §2  ARM + HAND RIG ═══════════════════════════════

  { name:'middle', base:[0.089,0, 0.0095], quat:yaw( 0.04), fanFix: 0.04, len:[0.044,0.027,0.022], r:0.0095 },
  { name:'ring',   base:[0.084,0,-0.0105], quat:yaw(-0.07), fanFix: 0.00, len:[0.040,0.025,0.021], r:0.0089 },

  { x:0.13,  s:0.080, th:3*PI/2,     a:0.10 },  // triceps
  { x:0.302, s:0.018, th:3*PI/2,     a:0.10 },  // olecranon
  { x:0.36,  s:0.050, th:PI/2-0.6,   a:0.10 },  // brachioradialis
  { x:0.37,  s:0.060, th:PI+0.5,     a:0.08 },  // flexor mass
  { x:WX-0.012, s:0.010, th:-0.8,    a:0.12 },  // ulna head

const SPLAY = [0, 0.20, 0.04, 0.12, 0.16];                                                       // open fingers fan out, pinky most
const RELAX = [null,[0.30,0.38,0.22],[0.42,0.50,0.30],[0.52,0.58,0.34],[0.60,0.62,0.36]];        // hanging loose: the curl deepens toward the pinky

  open:  [-0.30, 0.03, 0.05, 0.05, 0.00],
  relax: [0.12, 0.25, 0.30, 0.30, 0.15],
  beak:  [-0.06, 0.70, 1.10, 0.82, -0.04],     // solved: thumb tip meets the gathered fingertips
  fist:  [0.187, 0.806, 1.275, 0.37, -0.045],  // solved: lies flush across index + middle
  ready: [-0.15, 0.10, 0.15, 0.55, 0.00],     // held clear below the palm while the fingers close
  grab:  [-0.02, 0.75, 1.10, 0.45, 0.00],      // aims into the ball; contact stops it

const ORB_R = 0.033;
/* Hand shapes (the original behaviour helpers, now writing into any pose object T with curl/spread/roll). */
const blendCurl = (T, f, A, Bp, k) => { for (let j = 0; j < 3; j++) T.curl[f][j] = lerp(A[f][j], Bp[f][j], k); };

  grip(T, g) {
    for (let f = 1; f < 5; f++) { blendCurl(T, f, OPEN, GRAB, g); T.spread[f] = lerp(SPLAY[f]*0.8, [0,0.08,0,0.06,0.10][f], g); }
    setThumb(T, THUMB.open, THUMB.grab, g);
  },
  // hanging loose: the curl deepens toward the little finger, with a slow drift (seed differs per hand)
  relax(T, t, seed = 0, k = 1) {
    for (let f = 1; f < 5; f++) { for (let j = 0; j < 3; j++) T.curl[f][j] = RELAX[f][j]*k + 0.05*noise(t*0.6, f*3+j+seed); T.spread[f] = 0; }

  open(T, k = 1) { for (let f = 1; f < 5; f++) { blendCurl(T, f, RELAX, OPEN, k); T.spread[f] = SPLAY[f]*k; } setThumb(T, THUMB.relax, THUMB.open, k); },
  // two-stage fist: fingers fold index-last… thumb swings clear first, then folds over them a beat behind

const cd1 = new V3(), cd2 = new V3(), cr = new V3(), cv2g = new V3();
function segDist2(p1, q1, p2, q2) {                      // squared distance between two segments

  const a = cd1.dot(cd1), e = cd2.dot(cd2), f = cd2.dot(cr), c = cd1.dot(cr), b = cd1.dot(cd2), den = a*e - b*b;

  const tw2   = mkBone('twist2',   tw1,   [L2/3,0,0], null, L2/3);

    const b2 = mkBone(F.name+'3', b1, [F.len[1],0,0], null, F.len[2]);

/* Surface nets on a regular grid, with two refinements over the hand's version:

/* ═══════════════════════════════ §5  BODY SKIN WEIGHTS ═══════════════════════════════
   Painted procedurally from the bind-pose position, in the same spirit as the arm:
   - joints that fold one way get a narrow band on the inside of the bend (a clean crease where the two
     segments press together) and a wide band on the outside (smooth stretch over the point);
   - each hinge and the hip has a half-angle helper bone that owns the band in the middle of the joint;
   - roll is spread along the thigh and upper arm by twist helpers;

  const t4 = smooth(yb - 0.03, yb + 0.04, y)*(1 - smooth(0.045, 0.085, ax));

/* ═══════════════════════════════ §6  ASSEMBLY ═══════════════════════════════
   One skinned mesh: the body surface plus the two arms (one arm-space geometry, placed twice).
   Morph targets: 0/1 left biceps/forearm, 2/3 right biceps/forearm, 4/5 left/right quadriceps,
   6/7 left/right calf, 8 breath.                                                                           */
const MORPH = { bicep:[0,2], fore:[1,3], quad:[4,5], calf:[6,7], breath:8, N:9 };

  high: { label:'High', handH:0.0015, tubeN:96, tubeR:32, bodyH:0.0065 },

// the target: it drifts between goals (or sits where the user dragged it)
const marker = { pos:new V3(0, 1.45, 2.2), goal:new V3(0, 1.45, 2.2), dragging:false, hold:0 };
function driveMarker(dt, k = 4) { marker.pos.lerp(marker.goal, 1 - Math.exp(-dt*k)); }
const viewer = () => camera.position.clone();
// how far a hand target lies beyond comfortable reach from the (upright) shoulder: used to bend at the hips and knees
function reachLean(i, p) {
  const sh = groundPt(SIDES[i]*0.178, 1.425, 0, new V3()), d = p.distanceTo(sh), low = smooth(1.15, 0.55, p.y);
  return { pitch:clamp((d - 0.50)*2.0, 0, 0.75)*smooth(1.5, 1.0, p.y) + 0.35*low, knee:-0.30*low, yaw:0 };
}
// turn the chest toward a point (fraction of the horizontal angle, limited)
function chestToward(w, p, k = 0.5, lim = 0.5) {
  const a = angDiff(Math.atan2(p.x - root.pos.x, p.z - root.pos.z), root.yaw);
  w.spine.yaw = clamp(a*k, -lim, lim); return a;
}
// which hand: the one on the target's side, with hysteresis so it does not flip back and forth
function handFor(p, cur) {
  const lx = (p.x - root.pos.x)*Math.cos(root.yaw) - (p.z - root.pos.z)*Math.sin(root.yaw);
  return lx > 0.12 ? 0 : lx < -0.12 ? 1 : cur;
}

MOVES.turn = {
  label:'Turn', hint:'Turns in place to face the moving target: eyes first, then head, chest, and finally the feet step round.',
  props:['target'],
  enter() { this.a0 = root.yaw; this.c = root.pos.clone(); },
  update(t, w, dt) {
    // the target circles the figure, pausing now and then so the body can catch up (or follows the user's drag)
    if (!marker.dragging && marker.hold <= 0) {
      const a = this.a0 + 2.2*Math.sin(t*0.42) + 0.9*Math.sin(t*0.19);
      marker.goal.set(this.c.x + 2.2*Math.sin(a), 1.3 + 0.25*Math.sin(t*0.7), this.c.z + 2.2*Math.cos(a));
    }
    driveMarker(dt, 6);
    w.look = marker.pos.clone();
    const want = Math.atan2(marker.pos.x - root.pos.x, marker.pos.z - root.pos.z), off = angDiff(want, root.yaw);
    // the trunk twists toward it first; the heading only follows once it is well off to the side
    w.spine.yaw = clamp(off, -0.5, 0.5)*0.6;
    if (Math.abs(off) > 0.5 || this.turning) { this.turning = Math.abs(off) > 0.08; w.faceYaw = want; }
    hangArms(w, t);
  },
};

MOVES.wave = {
  label:'Wave', hint:'Raises the right hand and waves from the elbow at you; the wrist and fingers trail behind.',
  update(t, w) {
    hangArms(w, t);
    const i = 1, a = w.arms[i], up = smooth(0.0, 0.9, t), wv = 6.4, amp = 0.12*smooth(0.6, 1.3, t);
    armPt(i, lerp(0.09, 0.27 + amp*Math.sin(t*wv), up), lerp(-0.548, 0.20 + 0.014*Math.cos(t*wv*2), up), lerp(0.035, 0.11, up), a.tgt);
    armDir(i, 0.6, -1, -0.3, a.pole); armDir(i, lerp(-1, 0, up), 0.1, lerp(0.15, 1, up), a.palm);
    HAND.open(a, up); a.tgtW = 11; a.wflex = 0.12*up; a.wdev = -0.16*Math.cos(t*wv)*up*smooth(0.6, 1.3, t); a.tense = 0.1;
    w.look = viewer(); w.bias = 0.35*up; w.spine.roll = -0.05*up; w.spine.pitch = -0.02;
  },

MOVES.point = {
  label:'Point', hint:'Points at the target with the nearer hand; the chest turns toward it and the eyes follow. Drag the target.',
  props:['target'],
  enter() { this.side = 1; this.c = { pos:root.pos.clone(), yaw:root.yaw }; },
  update(t, w, dt) {
    if (!marker.dragging && marker.hold <= 0) groundPt(1.3*Math.sin(t*0.29), 1.3 + 0.45*Math.sin(t*0.47 + 1), 2.2 + 0.5*Math.sin(t*0.21), marker.goal, this.c);
    driveMarker(dt, 3);
    hangArms(w, t);
    const T = marker.pos, i = this.side = handFor(T, this.side), a = w.arms[i], k = smooth(0.1, 0.9, t);
    const sh = armPt(i, 0, 0, 0, new V3()), dir = new V3().subVectors(T, sh).normalize();
    a.tgt.lerp(_v3.copy(sh).addScaledVector(dir, 0.535), k);
    a.pole.set(0, -1, 0).addScaledVector(leftOf(root.yaw, _v1), SIDES[i]*0.6);
    a.palm.set(0, -1, 0).addScaledVector(leftOf(root.yaw, _v1), -SIDES[i]*0.4).normalize();
    HAND.point(a, k); a.tgtW = 8; a.wflex = 0; a.wdev = 0; a.tense = 0.3*k;
    w.look = T.clone(); chestToward(w, T, 0.35, 0.45); w.bias = (i === 0 ? 0.3 : -0.3)*k;
  },
};

MOVES.reach = {
  label:'Reach', hint:'Reaches for the target with the nearer hand, bending at the hips when it is far. Drag the target.',
  props:['target'],
  enter() { this.side = 1; this.hold = 0.3; this.c = { pos:root.pos.clone(), yaw:root.yaw }; this.grip = 0; },
  update(t, w, dt) {
    if (!marker.dragging) { this.hold -= dt; if (this.hold <= 0 && marker.hold <= 0) {
      { const y = 0.9 + Math.random()*0.85, x = (-0.45 + Math.random()*0.9)*(0.6 + 0.4*smooth(0.9, 1.3, y));
        groundPt(x, y, 0.42 + Math.random()*0.22 + 0.18*smooth(1.15, 0.9, y), marker.goal, this.c); } this.hold = 3.3 + Math.random()*1.3; } }
    driveMarker(dt, 3.5);
    hangArms(w, t);
    const T = marker.pos, i = this.side = handFor(T, this.side), a = w.arms[i], A = arms[i];
    // Going straight at the target would drive the fingers into it. Instead the palm first lines up over it
    // (the target sits along the direction the palm faces), and only then closes the remaining gap along that direction.
    const nOut = A.palmNormalWorld(new V3()), pw = A.palmWorld(new V3()), off = new V3().subVectors(T, pw);
    const along = off.dot(nOut), side = Math.sqrt(Math.max(0, off.lengthSq() - along*along));
    a.tgt.copy(T).addScaledVector(nOut, -clamp(side*1.6, 0, 0.10)); a.palmAt = true; a.tgtW = 6.5;
    const up = smooth(-0.05, 0.25, T.y - armPt(i, 0, 0, 0, _v3).y + 0.31);
    armDir(i, -0.3, lerp(-1, -0.25, up), lerp(0.1, 1, up), a.palm); armDir(i, 0.55, -1, -0.35, a.pole);
    this.grip = 1 - smooth(0.012, 0.05, pw.distanceTo(T));                  // close only once the target is in the palm
    HAND.grip(a, this.grip); a.wflex = lerp(0.28, 0.05, this.grip); a.tense = this.grip*0.6; a.orb = T;
    const L = reachLean(i, T); w.spine.pitch = L.pitch; w.pelvis.h = L.knee; chestToward(w, T, 0.3, 0.4);
    w.look = T.clone(); w.bias = i === 0 ? 0.25 : -0.25;
    props.target.mats[0].emissiveIntensity = 0.55 + 1.1*this.grip;
  },
};

MOVES.pick = {
  label:'Pick up', hint:'Picks the ball off the table, carries it and sets it down; the hands take turns. Fingers wrap it joint by joint.',
  props:['table', 'ball'], CYCLE:9.2,
  enter() {
    placeProp(props.table, 0, 0.60);
    const y = props.table.top + ORB_R;
    this.spots = { R:groundPt(-0.15, y, 0.43, new V3()), C:groundPt(0.0, y, 0.47, new V3()), L:groundPt(0.15, y, 0.43, new V3()) };
    this.seq = [['R', 'C', 1], ['C', 'L', 0], ['L', 'C', 0], ['C', 'R', 1]];        // from, to, hand
    release(); ball.pos.copy(this.spots.R); ball.vel.set(0, 0, 0); this.cyc = -1;
  },
  leave() { release(); return 0; },
  exit() { release(); },
  update(t, w) {
    const C = this.CYCLE, n = Math.floor(t/C), p = t - n*C, [fk, tk, i] = this.seq[n % 4], from = this.spots[fk], to = this.spots[tk];
    if (n !== this.cyc) { this.cyc = n; if (ball.held < 0 && ball.pos.distanceTo(from) > 0.06) { ball.pos.copy(from); ball.vel.set(0,0,0); } }
    hangArms(w, t);
    const a = w.arms[i], hover = 0.10, carry = groundPt(SIDES[i]*0.12, 1.06, 0.30, new V3()), goal = new V3(), up = new V3(0, 1, 0);
    let g = 0, on = 1;
    if (p < 1.1)      { goal.copy(from).addScaledVector(up, hover); on = smooth(0, 0.9, p); }
    else if (p < 1.8) { goal.copy(from).addScaledVector(up, hover*(1 - smooth(1.1, 1.7, p))); }
    else if (p < 2.3) { goal.copy(from); g = smooth(1.8, 2.25, p); }
    else if (p < 3.6) { const k = smooth(2.3, 3.5, p); goal.lerpVectors(from, carry, k).addScaledVector(up, 0.08*Math.sin(k*PI)); g = 1; }
    else if (p < 5.0) { goal.copy(carry).addScaledVector(up, 0.012*Math.sin((p - 3.6)*3)); g = 1; }
    else if (p < 6.0) { const k = smooth(5.0, 5.9, p); goal.lerpVectors(carry, _v3.copy(to).addScaledVector(up, hover), k); g = 1; }
    else if (p < 6.6) { goal.copy(to).addScaledVector(up, hover*(1 - smooth(6.0, 6.5, p))); g = 1; }
    else if (p < 7.1) { goal.copy(to); g = 1 - smooth(6.6, 7.0, p); }
    else              { goal.copy(to).addScaledVector(up, hover*smooth(7.1, 7.6, p)); on = 1 - smooth(7.5, 8.4, p); }
    if (p >= 2.15 && p < 6.8) { if (ball.held !== i) grab(i); } else if (ball.held === i) release();
    // blend from the hanging hand into the task (and back out at the end of the cycle)
    a.tgt.lerp(goal, on); a.palmAt = on > 0.5; a.tgtW = 7;
    a.palm.lerp(_v1.set(0, -1, 0).addScaledVector(fwdOf(root.yaw, _v2), 0.05), on); armDir(i, 0.7, -0.8, -0.3, _v1); a.pole.lerp(_v1, on);
    if (on > 0.02) { HAND.grip(_tmpHand, g); for (let f = 0; f < 5; f++) { for (let j = 0; j < 3; j++) a.curl[f][j] = lerp(a.curl[f][j], _tmpHand.curl[f][j], on); a.spread[f] = lerp(a.spread[f], _tmpHand.spread[f], on); } a.roll = lerp(a.roll, _tmpHand.roll, on); }
    a.wflex = lerp(a.wflex, lerp(0.25, 0.08, g), on); a.tense = g*0.6;
    const overTable = (p > 0.6 && p < 2.6) || (p > 5.4 && p < 7.9);
    a.surfY = overTable ? props.table.top : null; a.orb = ball.pos;
    const L = reachLean(i, goal); w.spine.pitch = L.pitch*on; w.pelvis.h = L.knee*on; chestToward(w, goal, 0.25*on, 0.35);
    w.look = (p > 4.6 && p < 6.4 ? to : ball.pos).clone(); w.bias = (i === 0 ? 0.25 : -0.25)*on;
  },
};
const _tmpHand = armWish();

MOVES.sit = {
  label:'Sit', hint:'Sits down on the chair and stands back up: hips back, chest forward over the feet, then down.',
  props:['chair'], CYCLE:10,
  enter() { placeProp(props.chair, 0, -0.34); },
  leave(L) {                                   // never leave while sitting: stand up first, then hand over
    const C = this.CYCLE, p = L.t % C, base = L.t - p;
    if (p > 0.45 && p < 5.5) { L.t = base + 5.5; return 1.9/ui.speed; }
    if (p >= 5.5 && p < 7.4) return (7.4 - p)/ui.speed;
    return 0;
  },
  update(t, w) {
    const p = t % this.CYCLE, u = clamp((p - 0.5)/1.8, 0, 1), v = clamp((p - 5.5)/1.9, 0, 1);
    // seat progress: hips travel back before they drop when sitting; on the way up the chest leads, hips follow
    let z, h, lean, tilt;
    if (p < 5.5) { z = -0.33*smooth(0, 0.75, u); h = -0.355*smooth(0.15, 1, u); lean = 0.50*Math.sin(PI*Math.min(1, u*0.9)); tilt = 0.30*Math.sin(PI*u) - 0.06*smooth(0.8, 1, u); }
    else         { z = -0.33*(1 - smooth(0.25, 1, v)); h = -0.355*(1 - smooth(0.22, 0.95, v)); lean = 0.62*Math.sin(PI*Math.min(1, v*1.12)); tilt = 0.32*Math.sin(PI*v) - 0.10*(1 - smooth(0, 0.3, v)); }
    const seat = clamp(-h/0.355, 0, 1);
    w.pelvis.z = z; w.pelvis.h = h; w.pelvis.pitch = tilt; w.spine.pitch = lean - 0.06*seat;
    w.balance = 1 - smooth(0.55, 0.9, seat); w.seated = seat; w.plantLock = p > 0.3 && p < 7.6;
    w.stance.width = 0.12; w.stance.toeOut = 0.16;
    hangArms(w, t);
    for (let i = 0; i < 2; i++) {                // hands forward while lowering, then resting on the thighs
      const a = w.arms[i], fwdArm = Math.sin(PI*(p < 5.5 ? u : v))*0.8;
      if (fwdArm > 0.01) { armPt(i, 0.07, -0.42, 0.28, _v1); a.tgt.lerp(_v1, fwdArm); }
      if (seat > 0.01) {
        groundPt(SIDES[i]*0.11, 0.665, -0.05, _v1); a.tgt.lerp(_v1, seat); a.palmAt = seat > 0.5;
        a.palm.lerp(_v2.set(0, -1, 0), seat); armDir(i, 0.5, 0.2, -1, _v3); a.pole.lerp(_v3, seat);
      }
    }
    w.look = groundPt(0.3*noise(t*0.15, 4), 1.35 - 0.35*Math.sin(PI*(p < 5.5 ? u : v)), 2.5, new V3());
  },
};

MOVES.squat = {
  label:'Squat', hint:'A deep squat: feet turn out, knees track over the toes, hips sit back and the arms come forward to balance.',
  CYCLE:6.4,
  leave(L) {
    const p = (L.t - 1) % this.CYCLE;
    if (L.t > 1 && p > 0.2 && p < 3.0) { L.t = L.t - p + 3.0; return 1.6/ui.speed; }
    if (L.t > 1 && p >= 3.0 && p < 4.6) return (4.6 - p)/ui.speed;
    return 0;
  },
  update(t, w) {
    // the first second only widens the stance (the feet step out); then the cycle runs
    const p = t < 1 ? -1 : (t - 1) % this.CYCLE;
    const d = p < 0 ? 0 : p < 1.8 ? minJerk(smooth(0.2, 1.8, p)) : p < 3.0 ? 1 : 1 - minJerk(smooth(3.0, 4.6, p));
    w.stance.width = 0.15; w.stance.toeOut = 0.32; w.plantLock = d > 0.02;
    w.pelvis.h = -0.47*d; w.pelvis.z = -0.05*d; w.pelvis.pitch = 0.30*d; w.spine.pitch = 0.40*d; w.balance = 1;
    hangArms(w, t);
    for (let i = 0; i < 2; i++) { const a = w.arms[i]; armPt(i, 0.03, -0.05, 0.52, _v1); a.tgt.lerp(_v1, smooth(0.05, 0.7, d)); armDir(i, 0.5, -1, 0, _v2); a.pole.lerp(_v2, d); a.palm.lerp(_v2.set(0, -1, 0), d); }
    w.look = groundPt(0, 1.0 + 0.4*(1 - d), 3, new V3());
  },
};

MOVES.stretch = {
  label:'Stretch', hint:'Arms overhead, up onto the toes, a side bend each way, then back down.',
  CYCLE:9.5,
  update(t, w) {
    const p = t % this.CYCLE;
    const up = smooth(0.2, 1.6, p)*(1 - smooth(7.4, 8.8, p)), toes = smooth(1.6, 2.4, p)*(1 - smooth(6.3, 7.1, p));
    const roll = 0.26*(smooth(2.6, 3.5, p) - 2*smooth(3.8, 4.9, p) + smooth(5.2, 6.1, p));
    hangArms(w, t);
    for (let i = 0; i < 2; i++) {
      const a = w.arms[i];
      armPt(i, 0.05, 0.555, 0.07, _v1); a.tgt.lerp(_v1, up);
      armDir(i, 0.8, 0.3, -0.5, _v1); a.pole.lerp(_v1, up); armDir(i, -1, 0, 0.35, _v1); a.palm.lerp(_v1, up);
      HAND.open(_tmpHand, 1); for (let f = 0; f < 5; f++) { for (let j = 0; j < 3; j++) a.curl[f][j] = lerp(a.curl[f][j], _tmpHand.curl[f][j], up); a.spread[f] = lerp(a.spread[f], _tmpHand.spread[f], up); }
      a.wflex = lerp(a.wflex, -0.25, up); a.tense = 0.4*up;
    }
    w.heel = [0.38*toes, 0.38*toes]; w.pelvis.h = 0.05*toes; w.spine.pitch = -0.08*up; w.spine.roll = roll*up;
    w.look = groundPt(0, lerp(1.55, 2.6, up*0.8), 2.2, new V3());
  },
};

const MV = {
  layers:[], pending:null,         // layers: [{ m, key, w (fade 0..1), t (movement time), wish }]
  out:newWish(), TRANS:0.9,
  set(key) {
    if (!MOVES[key]) return;
    const top = this.layers[this.layers.length-1];
    if (top && top.key === key && !this.pending) return;
    // a movement that is mid-way (seated, squatting) first finishes; the new one blends in after
    if (top && top.m.leave && !this.pending) { const d = top.m.leave(top); if (d > 0) { this.pending = { key, t:d }; this.current = key; return; } }
    if (this.pending) { this.pending.key = key; this.current = key; return; }
    this.push(key);
  },
  push(key) {
    const m = MOVES[key];
    for (const k in props) props[k].want = (m.props || []).includes(k) ? 1 : 0;
    m.enter && m.enter();
    this.layers.push({ m, key, w:this.layers.length ? 0 : 1, t:0, wish:newWish() });
    this.current = key;
  },
  update(dt) {
    if (this.pending && (this.pending.t -= dt) <= 0) { const k = this.pending.key; this.pending = null; this.push(k); }
    const tempo = ui.speed;
    for (const L of this.layers) {
      L.t += dt*(L.m === MOVES.walk ? 1 : tempo);
      Object.assign(L.wish, newWish()); L.m.update(L.t, L.wish, dt*(L.m === MOVES.walk ? 1 : tempo), L);
    }
    const top = this.layers[this.layers.length-1];
    if (top.w < 1) top.w = Math.min(1, top.w + dt/(top.m.trans || this.TRANS));
    // blend oldest → newest, each layer eased in over the ones below it
    copyWish(this.out, this.layers[0].wish);
    for (let i = 1; i < this.layers.length; i++) { const L = this.layers[i], e = L.w*L.w*(3 - 2*L.w); lerpWish(this.out, this.out, L.wish, e); }
    // once the top layer is fully in, the layers under it are gone
    if (top.w >= 1 && this.layers.length > 1) { for (const L of this.layers.slice(0, -1)) L.m.exit && L.m.exit(); this.layers = [top]; }
    return this.out;
  },
};

/* ═══════════════════════════════ §11  FRAME UPDATE ═══════════════════════════════ */
function update(dt) {
  const w = MV.update(dt);
  if (ui.lookCursor) w.look = ui.cursor.clone();
  for (let i = 0; i < 2; i++) {             // the arms' desired poses come straight from the blended wish
    const a = w.arms[i], P = arms[i].P;
    P.tgt.copy(a.tgt); P.pole.copy(a.pole); P.palm.copy(a.palm); P.palmAt = a.palmAt; P.tgtW = a.tgtW; P.wflex = a.wflex; P.wdev = a.wdev;
    P.tense = a.tense; P.roll = a.roll; P.surfY = a.surfY; P.orb = a.orb;
    for (let f = 0; f < 5; f++) { for (let j = 0; j < 3; j++) P.curl[f][j] = a.curl[f][j]; P.spread[f] = a.spread[f]; }
  }
  solveBody(dt, w);
  updateBall(dt);
  updateProps(dt);
  marker.hold = Math.max(0, marker.hold - dt);
  props.target.obj.position.copy(marker.pos);
}
// start-up: stand the figure in place and let every spring settle before the first frame is shown
function settleAll(seconds = 1.5) {
  for (const F of feet) { footHome(F.i, newWish(), F.g); F.yaw = root.yaw + F.s*0.13; footPose(F); }
  for (let k = 0; k < seconds*60; k++) update(1/60);
}
MV.set('idle');
applyBody(1/60);
for (const A of arms) A.settle();
settleAll();

document.getElementById('loading')?.remove();
// the orbit target glides after the figure, and the camera moves with it, so orbiting still works while walking
const camFollow = new V3(0, 0.92, 0);
function followCamera(dt) {
  const want = _v3.set(pelvis.position.x, 0.92, pelvis.position.z), k = 1 - Math.exp(-dt*2.5);
  const d = _v4.subVectors(want, camFollow).multiplyScalar(k);
  camFollow.add(d); controls.target.add(d); camera.position.add(d);
  keyL.target.position.copy(camFollow); keyL.position.copy(camFollow).add(_v4.set(1.6, 2.5, 2.6));
}
const clock = new THREE.Clock();
let paused = false;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) update(dt);
  followCamera(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
window.rig = { ready:true, geo, figure, bones, arms, legs, shotView, scene, camera, controls, THREE, testPose, body, applyBody,
  MV, MOVES, ui, root, feet, gait, com, supportPts, update, followCamera, legState, ball, props, marker, pause: v => paused = v,
  step: (sec, cb) => { const n = Math.round(sec*60); for (let i = 0; i < n; i++) { update(1/60); cb && cb(i); } } };
</script>
