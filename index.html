// Swing–twist split of a rotation q about a unit axis given in the rest frame: q = swing · twist.
// The twist is q's vector part projected on the axis (renormalised); the swing is what is left.
function swingTwist(q, axis, swingOut, twistOut) {

/* Damped springs. Every animated channel goes through one: x chases t with stiffness w (rad/s) and damping ratio z. */
function springBank() {
  const ALL = [];
  const sp = (x, w, z=1) => { const s = { x, v:0, t:x, w, z }; ALL.push(s); return s; };
  class VS {
    constructor(x,y,z,w,zeta=1) { this.s = [sp(x,w,zeta), sp(y,w,zeta), sp(z,w,zeta)]; }
    to(v, w) { this.s[0].t = v.x; this.s[1].t = v.y; this.s[2].t = v.z; if (w) for (const s of this.s) s.w = w; }
    get(v) { return v.set(this.s[0].x, this.s[1].x, this.s[2].x); }
    snap(v) { for (let i = 0; i < 3; i++) { const s = this.s[i]; s.x = s.t = v.getComponent(i); s.v = 0; } }
  }
  const step = h => { for (const s of ALL) { s.v += (-2*s.z*s.w*s.v - s.w*s.w*(s.x-s.t))*h; s.x += s.v*h; } };
  const run = dt => { const n = Math.max(1, Math.ceil(dt/0.006)); for (let i = 0; i < n; i++) step(dt/n); };
  return { sp, VS, run, ALL };

/* ═══════════════════════════════ §1  PROPORTIONS ═══════════════════════════════

function makeArm(side) {

  const fore  = mkBone('forearm',  upper, [L1,0,0], null, L2/3);

  const tw2   = mkBone('twist2',   tw1,   [L2/3,0,0], null, L2/3);

    const b2 = mkBone(F.name+'3', b1, [F.len[1],0,0], null, F.len[2]);

/* Surface nets on a regular grid, with two refinements over the hand's version:

  }

/* ═══════════════════════════════ §5  BODY SKIN WEIGHTS ═══════════════════════════════
   Painted procedurally from the bind-pose position, in the same spirit as the arm:
   - joints that fold one way get a narrow band on the inside of the bend (a clean crease where the two
     segments press together) and a wide band on the outside (smooth stretch over the point);
   - each hinge and the hip has a half-angle helper bone that owns the band in the middle of the joint;
   - roll is spread along the thigh and upper arm by twist helpers;

     overlap they move together and the tube stays buried in the torso.                                      */

  const t1 = smooth(1.005, 1.085, y), t2 = smooth(1.115, 1.195, y), t3 = smooth(1.225, 1.315, y);
  // neck: only the column itself; the slope of the trapezius toward the shoulder stays with the chest

  const t4 = smooth(yb - 0.03, yb + 0.04, y)*(1 - smooth(0.045, 0.085, ax));

// The shoulder field: torso weights blended into the arm's own painted weights, as a function of arm-space x
// and the distance from the arm axis. Used for body vertices and for the buried start of the arm tube alike.
function shoulderWeights(x, y, z, m, torso) {

  const ra = Math.hypot(ya, za);

/* ═══════════════════════════════ §6  ASSEMBLY ═══════════════════════════════
   One skinned mesh: the body surface plus the two arms (one arm-space geometry, placed twice).
   Morph targets: 0/1 left biceps/forearm, 2/3 right biceps/forearm, 4/5 left/right quadriceps,
   6/7 left/right calf, 8 breath.                                                                           */
const MORPH = { bicep:[0,2], fore:[1,3], quad:[4,5], calf:[6,7], breath:8, N:9 };

  };

const eyes = SIDES.map(s => {
  const e = new THREE.Mesh(new THREE.SphereGeometry(0.0118, 24, 16), eyeMat);
  const p = new V3().fromArray(mirrorX(J.eye, s)).sub(bw.get(head)); e.position.copy(p);
  e.userData.rest = p.clone(); head.add(e); return e;
});

const FLOOR = 0;
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), new THREE.MeshStandardMaterial({ color:0x4f4943, roughness:0.5 }));
floor.rotation.x = -PI/2; floor.receiveShadow = true; scene.add(floor);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.92, 0); controls.enableDamping = true; controls.minDistance = 0.4; controls.maxDistance = 9;
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const VIEWS = {
  front:[[0, 1.0, 3.6],[0, 0.9, 0]], side:[[3.6, 1.0, 0],[0, 0.9, 0]], threeq:[[2.4, 1.4, 2.7],[0, 0.9, 0]],
  face:[[0.35, 1.68, 0.75],[0, 1.62, 0]], elbow:[[0.55, 1.45, 0.6],[0.25, 1.3, 0.05]], kneeS:[[0.9, 0.5, 0.3],[0.1, 0.4, 0.1]], footF:[[0.7, 0.55, -0.3],[0.1, 0.55, -0.3]], under:[[0.5, 0.2, 0.9],[0, 0.45, -0.2]], armpit:[[0.9, 1.25, 0.5],[0.15, 1.3, 0]], back:[[0.4, 1.0, -3.6],[0, 0.9, 0]], hipR:[[-1.3, 0.55, 0.9],[0, 0.5, -0.1]], hipL:[[1.3, 0.55, -0.9],[0, 0.5, -0.1]], shoulder:[[1.1, 1.55, 1.1],[0.15, 1.35, 0]], shoulderB:[[0.9, 1.3, -1.1],[0.15, 1.35, 0]], low:[[0.8, 0.3, 1.6],[0, 0.6, 0]], hand:[[1.0, 1.5, 0.7],[0.8, 1.42, 0]], feet:[[0.5, 0.35, 1.0],[0, 0.1, 0]],
};
function shotView(v) {
  if (v.startsWith('mat:')) { figure.material = { skin:skinMat, xray:xrayMat, weights:weightMat }[v.slice(4)]; return; }
  if (v.startsWith('pose:')) { testPose(v.slice(5)); return; }
  const c = VIEWS[v]; if (!c) return;
  camera.position.fromArray(c[0]); controls.target.fromArray(c[1]); controls.update();
}
/* ── body pose application (filled by the solvers each frame) ── */
const armX = arms.map(() => ({ M:new M4(), rootBase:new M4(), morph:null }));
const body = {
  pelvisPos:new V3().fromArray(J.pelvis), pelvisQ:new Quat(), spine:[0,0,0], neckQ:new Quat(), headQ:new Quat(),
  clav:[[0,0],[0,0]],
  feet:[0,1].map(i => ({ ankle:new V3().fromArray(mirrorX(J.ankle, SIDES[i])), q:new Quat(), toe:0, pole:new V3(0,0,1) })),
};
function applyBody(dt) {
  pelvis.position.copy(body.pelvisPos); pelvis.quaternion.copy(body.pelvisQ);
  poseSpine(...body.spine);
  neck.quaternion.copy(body.neckQ); head.quaternion.copy(body.headQ);
  poseClavicle(0, ...body.clav[0]); poseClavicle(1, ...body.clav[1]);
  pelvis.updateMatrixWorld(true);
  for (let i = 0; i < 2; i++) { const F = body.feet[i]; poseLeg(i, F.ankle, F.pole, F.q, F.toe, body.pelvisQ); }
  pelvis.updateMatrixWorld(true);
  for (let i = 0; i < 2; i++) { armX[i].morph = figure.morphTargetInfluences; armSpace(arms[i], armX[i]); arms[i].solve(dt, armX[i]); }
  pelvis.updateMatrixWorld(true);
}
// test poses for checking the skin at extremes (Phase 2): pelvis height, spine pitch, hand targets…
function testPose(kind) {
  const P0 = new V3().fromArray(J.pelvis);
  body.pelvisPos.copy(P0); body.pelvisQ.identity(); body.spine = [0,0,0];
  for (let i = 0; i < 2; i++) { const F = body.feet[i]; F.ankle.fromArray(mirrorX(J.ankle, SIDES[i])); F.q.identity(); F.toe = 0; F.pole.set(0,0,1); body.clav[i] = [0,0]; }
  const m = figure.morphTargetInfluences; m.fill(0);
  const armPose = () => {
    // targets are written in each arm's own space (x out to the side, y up, z forward) and mapped to world
    for (let i = 0; i < 2; i++) {
      const A = arms[i], P = A.P, M = armX[i].M, at = (x, y, z) => P.tgt.set(x, y, z).applyMatrix4(M);
      const pole = (x, y, z) => P.pole.set(x, y, z).transformDirection(M), palm = (x, y, z) => P.palm.set(x, y, z).transformDirection(M);
      P.palmAt = false; P.surfY = null; P.orb = false; P.tgtW = 9; P.wflex = 0; P.wdev = 0; P.tense = 0;
      A.shapes.relax(0);
      if (kind === 'rest' || kind === 'sit') { at(0.09, -0.55, 0.03); pole(0.3, -0.1, -1); palm(-1, 0, 0.1); }
      if (kind === 'up') { at(0.07, 0.555, 0.03); pole(0.6, 0.2, -0.5); palm(-1, 0, 0.3); body.clav[i] = [0.35, 0.05]; }
      if (kind === 'flex') { at(0.03, -0.05, 0.13); pole(0.2, -1, -0.2); palm(-0.2, 0, -1); A.shapes.fist(1); P.tense = 1; }
      if (kind === 'squat') { at(0.0, -0.05, 0.53); pole(0.4, -1, 0); palm(-1, -0.4, 0); body.clav[i] = [0.1, 0.15]; }
      if (kind === 'forward') { at(0.0, 0.0, 0.55); pole(0.5, -1, 0); palm(0, -1, 0); }
      if (kind === 'across') { at(-0.25, -0.05, 0.4); pole(0.5, -1, 0); palm(-1, 0, 0); }
      if (kind === 'back') { at(0.15, -0.35, -0.3); pole(0.5, 0, 1); palm(0, 0, -1); }
    }
  };
  if (kind === 'squat') {
    body.pelvisPos.set(0, 0.47, -0.17); body.spine = [0.55, 0, 0]; body.pelvisQ.setFromAxisAngle(AX, 0.32);
    for (let i = 0; i < 2; i++) { const F = body.feet[i]; F.ankle.x = SIDES[i]*0.15; F.q.setFromAxisAngle(AY, SIDES[i]*0.3); F.pole.set(SIDES[i]*0.45, 0, 1); }
    m[MORPH.quad[0]] = m[MORPH.quad[1]] = 1;
  }
  if (kind === 'flex') {                                       // stand on the right leg, left heel pulled up to the buttock
    body.pelvisPos.x = -0.05;
    const F = body.feet[0]; F.ankle.set(0.1, 0.62, -0.30); F.q.setFromAxisAngle(AX, 1.0); F.pole.set(0, 0, 1);
    m[MORPH.calf[0]] = 1;
  }
  if (kind === 'sit') {
    body.pelvisPos.set(0, 0.57, -0.38); body.pelvisQ.setFromAxisAngle(AX, -0.1); body.spine = [0.05, 0, 0];
    for (let i = 0; i < 2; i++) body.feet[i].ankle.z = 0.04;
  }
  applyBody(1/60); armPose();
  for (const A of arms) A.settle();
  for (let k = 0; k < 120; k++) { applyBody(1/60); armPose(); }
}

document.getElementById('loading')?.remove();
function frame() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
window.rig = { ready:true, geo, figure, bones, arms, legs, shotView, scene, camera, controls, THREE, testPose, body, applyBody };
</script>
</body>
</html>
